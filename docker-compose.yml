services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      # Ensure paths inside the container match our layout
      STORAGE_DIR: "/app/data/storage"
      SQLITE_PATH: "/app/data/video-transcriber.sqlite"
      INSTAGRAM_COOKIES_PATH: "/app/secrets/instagram_cookies.txt"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    restart: unless-stopped

