services:
  - type: web
    name: video-peeker-transcriber-backend
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health

    # Persistent disk so the SQLite + downloads survive restarts/deploys.
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 10

    envVars:
      - key: STORAGE_DIR
        value: /app/data/storage
      - key: SQLITE_PATH
        value: /app/data/video-transcriber.sqlite
      - key: INSTAGRAM_COOKIES_PATH
        value: /app/secrets/instagram_cookies.txt
      - key: YOUTUBE_COOKIES_PATH
        value: /app/secrets/youtube_cookies.txt

